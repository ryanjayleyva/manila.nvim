# manila-day for tmux.
# Colors come from lua/manila/palettes/manila-day.lua.

set -g status-style "fg=#62584D,bg=#EAE0D1"
set -g status-left "#[fg=#F0E7D8,bg=#4A6482,bold] #S #[default] "
set -g status-right "#[fg=#7F5E28]#{?client_prefix, PREFIX ,}"

set -g window-status-format " #I #W "
set -g window-status-style "fg=#6C6153,bg=#EAE0D1"
set -g window-status-current-format " #I #W#{?window_zoomed_flag, Z,} "
set -g window-status-current-style "fg=#4A433C,bg=#F0E7D8,bold"
set -g window-status-activity-style "fg=#7F5E28,bg=#EAE0D1"
set -g window-status-separator ""

set -g pane-border-style "fg=#BFB29D"
set -g pane-active-border-style "fg=#4A6482"

set -g message-style "fg=#4A433C,bg=#DDD2C0"
set -g message-command-style "fg=#4A433C,bg=#DDD2C0"
set -g mode-style "fg=#4A433C,bg=#C9D2D8"

set -g display-panes-colour "#6C6153"
set -g display-panes-active-colour "#4A6482"
set -g clock-mode-colour "#4A6482"
