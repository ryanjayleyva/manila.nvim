# manila-night for tmux.
# Colors come from lua/manila/palettes/manila-night.lua.

set -g status-style "fg=#BEB4A5,bg=#2F3030"
set -g status-left "#[fg=#252729,bg=#91A9C5,bold] #S #[default] "
set -g status-right "#[fg=#D4B36F]#{?client_prefix, PREFIX ,}"

set -g window-status-format " #I #W "
set -g window-status-style "fg=#A89F91,bg=#2F3030"
set -g window-status-current-format " #I #W#{?window_zoomed_flag, Z,} "
set -g window-status-current-style "fg=#D9D0C3,bg=#252729,bold"
set -g window-status-activity-style "fg=#D4B36F,bg=#2F3030"
set -g window-status-separator ""

set -g pane-border-style "fg=#4A4A47"
set -g pane-active-border-style "fg=#91A9C5"

set -g message-style "fg=#D9D0C3,bg=#3A3B3A"
set -g message-command-style "fg=#D9D0C3,bg=#3A3B3A"
set -g mode-style "fg=#D9D0C3,bg=#3D4A58"

set -g display-panes-colour "#A89F91"
set -g display-panes-active-colour "#91A9C5"
set -g clock-mode-colour "#91A9C5"
